.text-box strong { font-weight: 700; }
.tbl-wrap { border: 1px solid #bbb; border-radius: 3px; overflow: hidden; }

.tbl-inner th, .tbl-inner td { padding: 2px 5px; border: 1px solid #ddd; white-space: nowrap; }
.tbl-inner thead tr:first-child th { background: #e8e8e8; font-weight: 700; text-align: center; }

.tbl-inner tbody tr:nth-child(even) { background: #fafafa; }
.tbl-inner tfoot td { font-weight: 700; background: #eaeaea; border-top: 2px solid #aaa; }
.tbl-inner td { text-align: center; }
.tbl-inner td:first-child { text-align: left; }
.cat-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
.arrow-up { color: #c00000; }
.arrow-dn { color: #375623; }
.arrow-eq { color: #888; }
#export-btn { padding: 7px 22px; cursor: pointer; font-size: 13px; border: 1px solid #888; border-radius: 4px; background: #f5f5f5; }

// ---- HELPERS ----
function sortWeeks(wks) {
  return [...wks].sort((a,b) => {
    const [da,ma,ya]=a.split('/'), [db,mb,yb]=b.split('/');
    return new Date(`${ya}-${ma}-${da}`) - new Date(`${yb}-${mb}-${db}`);
  });
}

function buildPct(raw) {
  const weeks = sortWeeks([...new Set(raw.map(r=>r.w))]);
  const frotaByWeek = {};
  raw.forEach(r => { if(!frotaByWeek[r.w]) frotaByWeek[r.w] = {}; frotaByWeek[r.w][r.cat] = r.frota||0; });
  // build agg occ and frota per week
  const occAgg = {}, frotaAgg = {};
  weeks.forEach(w => { occAgg[w]={}; ORDER.forEach(c=>occAgg[w][c]=0); frotaAgg[w]=0; });
  raw.forEach(r => { occAgg[r.w][r.cls]=(occAgg[r.w][r.cls]||0)+r.occ; if(r.frota&&r.frota>frotaAgg[r.w]) frotaAgg[r.w]=r.frota; });
  return {weeks, occAgg, frotaAgg};
}

function buildStats(raw) {
  const weeks = sortWeeks([...new Set(raw.map(r=>r.w))]);
  const lw=weeks[weeks.length-1], lw1=weeks[weeks.length-2], l4w=weeks.slice(-5,-1);
  const cats = {};
  raw.forEach(r => { if(!cats[r.cat]) cats[r.cat]={cls:r.cls}; cats[r.cat][r.w]=(cats[r.cat][r.w]||0)+r.occ; });
  const totByWeek = {};
  weeks.forEach(w => { totByWeek[w]=Object.values(cats).reduce((s,c)=>s+(c[w]||0),0); });
  const rows = {};
  Object.entries(cats).forEach(([cat,d]) => {
    rows[cat]={cls:d.cls, lw:d[lw]||0, lw1:d[lw1]||0, l4wAvg:parseFloat((l4w.reduce((s,w)=>s+(d[w]||0),0)/l4w.length).toFixed(1))};
  });
  return {rows, totLw:totByWeek[lw]||0, totLw1:totByWeek[lw1]||0, totL4w:parseFloat((l4w.reduce((s,w)=>s+(totByWeek[w]||0),0)/l4w.length).toFixed(1)), lw, lw1};
}

function arrow(c,p) {
  if(c===0&&p===0) return '<span class="arrow-eq">—</span>';
  if(c>p) return '<span class="arrow-up">▲</span>';
  if(c<p) return '<span class="arrow-dn">▼</span>';
  return '<span class="arrow-eq">—</span>';
}

// ---- TABLE ----
function buildTable() {
  const cpx=buildStats(rawCPX), com=buildStats(rawCOM);
  const [d1,m1]=cpx.lw1.split('/'), [d2,m2]=cpx.lw.split('/');
  document.getElementById('cpx-lw1-h').textContent=`${d1}/${m1}`;
  document.getElementById('cpx-lw-h').textContent=`${d2}/${m2}`;
  const [c1,mc1]=com.lw1.split('/'), [c2,mc2]=com.lw.split('/');
  document.getElementById('com-lw1-h').textContent=`${c1}/${mc1}`;
  document.getElementById('com-lw-h').textContent=`${c2}/${mc2}`;

  const COLOR_ORDER = {'#D3D3D3':0,'#4472C4':1,'#70AD47':2,'#FFC000':3,'#FF0000':4};
  const getDot = cat => {
    if(CAT_OVERRIDE[cat]) return CAT_OVERRIDE[cat];
    const c=cpx.rows[cat], m=com.rows[cat];
    const cls=(c&&c.lw>0)?c.cls:(m?m.cls:'Other');
    return CLASS_COLOR[cls]||'#D3D3D3';
  };
  const allCats = [...new Set([...Object.keys(cpx.rows),...Object.keys(com.rows)])].sort((a,b) => {
    const oa=COLOR_ORDER[getDot(a)]??99, ob=COLOR_ORDER[getDot(b)]??99;
    return oa!==ob ? oa-ob : a.localeCompare(b);
  });

  const tbody = document.getElementById('tblBody');
  allCats.forEach(cat => {
    const c=cpx.rows[cat]||{cls:'Other',lw:0,lw1:0,l4wAvg:0};
    const m=com.rows[cat]||{cls:'Other',lw:0,lw1:0,l4wAvg:0};
    const dot = getDot(cat);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><span class="cat-dot" style="background:${dot}"></span>${cat}</td>
      <td>${c.lw1||'—'} ${c.lw1>0?arrow(c.lw1,c.l4wAvg):''}</td>
      <td>${c.lw||'—'} ${c.lw>0?arrow(c.lw,c.lw1):''}</td>
      <td>${c.l4wAvg>0?c.l4wAvg.toFixed(1):'—'}</td>
      <td>${m.lw1||'—'} ${m.lw1>0?arrow(m.lw1,m.l4wAvg):''}</td>
      <td>${m.lw||'—'} ${m.lw>0?arrow(m.lw,m.lw1):''}</td>
      <td>${m.l4wAvg>0?m.l4wAvg.toFixed(1):'—'}</td>`;
    tbody.appendChild(tr);
  });

  document.getElementById('tblFoot').innerHTML = `<tr>
    <td>Σ Total</td>
    <td>${cpx.totLw1} ${arrow(cpx.totLw1,cpx.totL4w)}</td><td>${cpx.totLw} ${arrow(cpx.totLw,cpx.totLw1)}</td><td>${cpx.totL4w.toFixed(1)}</td>
    <td>${com.totLw1} ${arrow(com.totLw1,com.totL4w)}</td><td>${com.totLw} ${arrow(com.totLw,com.totLw1)}</td><td>${com.totL4w.toFixed(1)}</td>
  </tr>`;

  // text box
  const cpxBklg=(cpx.rows['Backlog']||{lw:0}).lw;
  const cpxIOT=(cpx.rows['IOT']||{lw:0,lw1:0});
  const cpxThr=(cpx.rows['Throttle']||{lw:0,lw1:0});
  const cpxUnd=(cpx.rows['Undiagnosed']||{lw:0,lw1:0});
  const cpxCB=(cpx.rows['Circuit Breaker']||{lw:0,lw1:0});
  const [ld,lm]=cpx.lw.split('/');
  document.getElementById('textBox').innerHTML=`<p>
    <strong>CPX: ${cpx.totLw} cases</strong> (LW ${ld}/${lm}), ${cpx.totLw<cpx.totLw1?'▼':'▲'} vs. LW-1 (${cpx.totLw1}).
    Circuit Breaker spiked to <strong>${cpxCB.lw}</strong> (vs. ${cpxCB.lw1} LW-1).
    Undiagnosed: <strong>${cpxUnd.lw}</strong> vs. ${cpxUnd.lw1} LW-1.
    Throttle: <strong>${cpxThr.lw}</strong>. IOT: <strong>${cpxIOT.lw}</strong>. Backlog: <strong>${cpxBklg}</strong>.<br><br>
    <strong>Comfort: ${com.totLw} cases</strong>
    (${com.totLw<com.totLw1?'▼':'▲'} vs. ${com.totLw1} LW-1). Undiagnosed dominated at <strong>${(com.rows['Undiagnosed']||{lw:0}).lw}</strong> cases.
  </p>`;
}

// ---- CHARTS ----
function makeChart(id, raw) {
  const weeks = sortWeeks([...new Set(raw.map(r=>r.w))]);
  const labels = weeks.map(w => { const [d,m]=w.split('/'); return `${d}/${m}`; });

  // aggregate % and occ per week per classification
  const pctAgg={}, occAgg={};
  weeks.forEach(w => { pctAgg[w]={}; occAgg[w]={}; ORDER.forEach(c=>{pctAgg[w][c]=0; occAgg[w][c]=0;}); });

  // collect frota per week (max across rows)
  const frotaByWeek={};
  raw.forEach(r => {
    if(r.frota && (!frotaByWeek[r.w]||r.frota>frotaByWeek[r.w])) frotaByWeek[r.w]=r.frota;
    occAgg[r.w][r.cls]=(occAgg[r.w][r.cls]||0)+r.occ;
  });

  // We use the pre-computed percentual_frota from Metabase rows directly
  // rebuild per-week per-cls % by summing row pct values
  const pctFromMeta={};
  weeks.forEach(w=>{pctFromMeta[w]={};ORDER.forEach(c=>pctFromMeta[w][c]=0);});
  raw.forEach(r=>{ if(r.pct!==undefined) pctFromMeta[r.w][r.cls]=(pctFromMeta[r.w][r.cls]||0)+r.pct; });

  // Since pct not in rawCPX/rawCOM objects above, compute from occ/frota
  // Use frota from separate lookup (embedded below)
  const frotaMap = id==='cpxChart' ? cpxFrota : comFrota;
  weeks.forEach(w => {
    const frota = frotaMap[w]||1;
    ORDER.forEach(cls => {
      pctAgg[w][cls] = parseFloat(((occAgg[w][cls]/frota)*100).toFixed(2));
    });
  });

  const totals = weeks.map(w => parseFloat(ORDER.reduce((s,c)=>s+(pctAgg[w][c]||0),0).toFixed(2)));

  const barDatasets = ORDER.map(cls => ({
    label: cls,
    data: weeks.map(w => pctAgg[w][cls]||0),
    occData: weeks.map(w => occAgg[w][cls]||0),
    backgroundColor: COLORS[cls],
    borderWidth: 0,
    stack: 'total',
    order: 0
  }));

  const rainDataset = {
    type: 'line',
    label: 'Rainfall SP (mm)',
    data: RAIN_SP.slice(0, weeks.length),
    borderColor: '#1565C0',
    backgroundColor: 'transparent',
    borderWidth: 2,
    pointRadius: 3,
    pointBackgroundColor: '#1565C0',
    fill: false,
    tension: 0.3,
    yAxisID: 'yRain',
    order: 1
  };

  const labelsPlugin = {
    id: 'barLabels',
    afterDatasetsDraw(chart) {
      const { ctx: c, scales: { x, y }, data } = chart;
      c.save();
      data.datasets.forEach((ds, di) => {
        if (!ds.occData) return;
        ds.data.forEach((val, i) => {
          if (val <= 0) return;
          const meta = chart.getDatasetMeta(di);
          const bar = meta.data[i];
          if (!bar) return;
          const barH = bar.height || 0;
          if (barH < 9) return;
          const occ = ds.occData[i];
          if (!occ) return;
          c.font = `600 ${barH >= 14 ? 9 : 7}px Arial`;
          c.fillStyle = 'rgba(0,0,0,0.75)';
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.fillText(occ, bar.x, bar.y + barH / 2);
        });
      });
      c.font = '700 11px Arial';
      c.fillStyle = '#222';
      c.textAlign = 'center';
      c.textBaseline = 'bottom';
      totals.forEach((val, i) => {
        c.fillText(val.toFixed(2) + '%', x.getPixelForValue(i), y.getPixelForValue(val) - 3);
      });
      c.restore();
    }
  };

  new Chart(document.getElementById(id).getContext('2d'), {
    type: 'bar',
    data: { labels, datasets: [...barDatasets, rainDataset] },
    plugins: [labelsPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.dataset.label === 'Rainfall SP (mm)'
              ? ` Rainfall: ${ctx.parsed.y}mm`
              : ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}% (${ctx.dataset.occData?ctx.dataset.occData[ctx.dataIndex]:''} cases)`
          }
        }
      },
      scales: {
        x: { stacked: true, ticks: { font: { size: 11 }, autoSkip: false, maxRotation: 45 }, grid: { display: false } },
        y: { stacked: true, min: 0, max: 4, ticks: { font: { size: 11 }, callback: v => v.toFixed(1) + '%', stepSize: 0.5 }, grid: { color: 'rgba(0,0,0,0.06)' } },
        yRain: { type: 'linear', position: 'right', min: 0, max: 120, ticks: { font: { size: 11 }, callback: v => v + 'mm', color: '#1565C0', stepSize: 30 }, grid: { display: false }, title: { display: true, text: 'mm', color: '#1565C0', font: { size: 11 } } }
      }
    }
  });
}
