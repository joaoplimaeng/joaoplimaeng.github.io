<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f0f0f0; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }

#slide { width: 1280px; background: #fff; padding: 14px 28px 18px 28px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #ccc; }
.top-spacer { height: 32px; }
.legend { display: flex; gap: 14px; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #444; }
.legend-box { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* Charts row */
.charts-row { display: flex; gap: 10px; align-items: stretch; }
.chart-col { flex: 1; display: flex; flex-direction: column; }
.chart-title { font-size: 10px; color: #4472C4; text-align: center; margin-bottom: 2px; font-weight: 600; }
.chart-wrap { position: relative; height: 300px; }

/* Tables row */
.tables-row { display: flex; gap: 10px; }
.tbl-block { flex: 1; border: 1px solid #d0d4db; border-radius: 6px; overflow: hidden; }
.tbl-header { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-bottom: 1px solid #e2e5ea; background: #f8f9fb; }
.tbl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.tbl-model { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; }
.tbl-meta { font-size: 9px; color: #888; margin-left: auto; }
table { width: 100%; border-collapse: collapse; }
thead tr { background: #f2f4f7; }
th { font-size: 8.5px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.08em; padding: 5px 10px; text-align: left; border-bottom: 1px solid #e8eaed; white-space: nowrap; }
th.r { text-align: right; }
td { font-size: 10.5px; padding: 6px 10px; border-bottom: 1px solid #f0f2f5; vertical-align: middle; color: #222; }
td.r { text-align: right; font-size: 10px; font-family: monospace; }
tr:last-child td { border-bottom: none; }
.rank { font-size: 9px; color: #bbb; width: 16px; }
.badge { display: inline-flex; align-items: center; font-size: 8.5px; font-weight: 500; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.og  { background: #eaf4ee; color: #1a7a3a; border: 1px solid #b6dfc4; }
.krc { background: #fdf3e3; color: #9a5c00; border: 1px solid #f0d09a; }
.urc { background: #fdecea; color: #a02020; border: 1px solid #f0b8b8; }
.bkl { background: #e8f0fe; color: #1a4fba; border: 1px solid #aac4f5; }
.oth { background: #f2f3f5; color: #555; border: 1px solid #d0d4db; }
.bar-wrap { display: flex; align-items: center; gap: 5px; }
.bar-track { flex: 1; height: 3px; background: #e8eaed; border-radius: 2px; overflow: hidden; min-width: 36px; }
.bar-fill { height: 100%; border-radius: 2px; }
.pct-val { font-size: 9.5px; color: #777; min-width: 32px; text-align: right; font-family: monospace; }
.trend { font-size: 9.5px; font-weight: 700; font-family: monospace; }
.up  { color: #c0392b; }
.dn  { color: #1a7a3a; }
.neu { color: #bbb; }

#export-btn { padding: 7px 22px; cursor: pointer; font-size: 13px; border: 1px solid #888; border-radius: 4px; background: #f5f5f5; }
</style>
</head>
<body>
<div id="slide">

function sortWeeks(wks){return[...wks].sort((a,b)=>{const[da,ma,ya]=a.split('/');const[db,mb,yb]=b.split('/');return new Date(`${ya}-${ma}-${da}`)-new Date(`${yb}-${mb}-${db}`);});}

function buildTop5(raw){
  const weeks=sortWeeks([...new Set(raw.map(r=>r.w))]);
  const lw=weeks[weeks.length-1],lw1=weeks[weeks.length-2];
  const lwData={},lw1Data={},lwCls={},lwPct={};
  raw.forEach(r=>{
    if(r.w===lw){lwData[r.cat]=(lwData[r.cat]||0)+r.occ;lwCls[r.cat]=r.cls;lwPct[r.cat]=(lwPct[r.cat]||0)+r.pct;}
    if(r.w===lw1){lw1Data[r.cat]=(lw1Data[r.cat]||0)+r.occ;}
  });
  const sorted=Object.entries(lwData).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const totLw=Object.values(lwData).reduce((s,v)=>s+v,0);
  const totPct=Object.values(lwPct).reduce((s,v)=>s+v,0);
  return{rows:sorted.map(([cat,occ])=>({cat,occ,cls:lwCls[cat],pct:lwPct[cat]||0,prev:lw1Data[cat]||null})),totLw,totPct:totPct.toFixed(2),lw};
}

function renderTable(tbodyId, metaId, raw, frota){
  const{rows,totLw,totPct,lw}=buildTop5(raw);
  const maxOcc=rows[0]?.occ||1;
  document.getElementById(metaId).textContent=`frota ${frota.toLocaleString('pt-BR')} · ${totLw} casos · ${totPct}%`;
  const tbody=document.getElementById(tbodyId);
  tbody.innerHTML=rows.map((r,i)=>{
    const delta=r.prev!==null?r.occ-r.prev:null;
    const trendHtml=delta===null?`<span class="trend neu">▲ novo</span>`:delta>0?`<span class="trend up">▲ +${delta}</span>`:delta<0?`<span class="trend dn">▼ ${delta}</span>`:`<span class="trend neu">–</span>`;
    const barW=Math.round((r.occ/maxOcc)*100);
    const barCol=COLORS[r.cls]||'#ccc';
    return`<tr>
      <td class="rank">${String(i+1).padStart(2,'0')}</td>
      <td>${r.cat}</td>
      <td><span class="badge ${BADGE[r.cls]||'oth'}">${BADGE_LABEL[r.cls]||r.cls}</span></td>
      <td class="r">${r.occ}</td>
      <td class="r"><div class="bar-wrap"><div class="bar-track"><div class="bar-fill" style="width:${barW}%;background:${barCol}"></div></div><span class="pct-val">${r.pct.toFixed(2)}%</span></div></td>
      <td class="r">${trendHtml}</td>
    </tr>`;
  }).join('');
}

function makeChart(id,raw){
  const weeks=sortWeeks([...new Set(raw.map(r=>r.w))]);
  const labels=weeks.map(w=>{const[d,m]=w.split('/');return`${d}/${m}`;});
  const pctAgg={},occAgg={};
  weeks.forEach(w=>{pctAgg[w]={};occAgg[w]={};ORDER.forEach(c=>{pctAgg[w][c]=0;occAgg[w][c]=0;});});
  raw.forEach(r=>{pctAgg[r.w][r.cls]=(pctAgg[r.w][r.cls]||0)+r.pct;occAgg[r.w][r.cls]=(occAgg[r.w][r.cls]||0)+r.occ;});
  const totals=weeks.map(w=>parseFloat(ORDER.reduce((s,c)=>s+(pctAgg[w][c]||0),0).toFixed(1)));
  const barDatasets=ORDER.map(cls=>({label:cls,data:weeks.map(w=>parseFloat((pctAgg[w][cls]||0).toFixed(2))),occData:weeks.map(w=>occAgg[w][cls]||0),backgroundColor:COLORS[cls],borderWidth:0,stack:'total',order:0}));
  const rainDataset={type:'line',label:'Rainfall SP (mm)',data:RAIN_SP.slice(0,weeks.length),borderColor:'#1565C0',backgroundColor:'transparent',borderWidth:2,pointRadius:3,pointBackgroundColor:'#1565C0',fill:false,tension:0.3,yAxisID:'yRain',order:1};
  const labelsPlugin={id:'barLabels',afterDatasetsDraw(chart){
    const{ctx:c,scales:{x,y}}=chart;c.save();
    chart.data.datasets.forEach((ds,di)=>{
      if(!ds.occData)return;
      ds.data.forEach((val,i)=>{
        if(val<=0)return;
        const meta=chart.getDatasetMeta(di),bar=meta.data[i];
        if(!bar)return;
        const barH=bar.height||0;if(barH<9)return;
        const occ=ds.occData[i];if(!occ)return;
        c.font=`600 ${barH>=14?9:7}px Arial`;c.fillStyle='rgba(0,0,0,0.75)';c.textAlign='center';c.textBaseline='middle';
        c.fillText(occ,bar.x,bar.y+barH/2);
      });
    });
    c.font='700 11px Arial';c.fillStyle='#222';c.textAlign='center';c.textBaseline='bottom';
    totals.forEach((val,i)=>{c.fillText(val.toFixed(1)+'%',x.getPixelForValue(i),y.getPixelForValue(val)-3);});
    c.restore();
  }};
  new Chart(document.getElementById(id).getContext('2d'),{
    type:'bar',data:{labels,datasets:[...barDatasets,rainDataset]},plugins:[labelsPlugin],
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.label==='Rainfall SP (mm)'?` Rainfall: ${ctx.parsed.y}mm`:` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(2)}% (${ctx.dataset.occData?ctx.dataset.occData[ctx.dataIndex]:''} cases)`}}},
      scales:{
        x:{stacked:true,ticks:{font:{size:9},autoSkip:false,maxRotation:45},grid:{display:false}},
        y:{stacked:true,min:0,max:4,ticks:{font:{size:10},callback:v=>v.toFixed(1)+'%',stepSize:0.5},grid:{color:'rgba(0,0,0,0.06)'}},
        yRain:{type:'linear',position:'right',min:0,max:120,ticks:{font:{size:10},callback:v=>v+'mm',color:'#1565C0',stepSize:30},grid:{display:false}}
      }
    }
  });
}
